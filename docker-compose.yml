version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - ENV=${ENV:-development}
      - EXTERNAL_DB_URL=${EXTERNAL_DB_URL}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - IG_BUSINESS_ACCOUNT_ID=${IG_BUSINESS_ACCOUNT_ID:-}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS as a JSON array}
      - REEL_SAMPLE_SIZE=12
      - SESSION_IDLE_MINUTES=30
      - SESSION_ABSOLUTE_HOURS=12
      - INITIAL_USER=${INITIAL_USER:-agency_admin}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:?Set INITIAL_PASSWORD in the environment}
    # No longer depends on local db service

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      backend:
        condition: service_healthy