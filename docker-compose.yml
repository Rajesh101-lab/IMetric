version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pagemetrics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pagemetrics"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/pagemetrics
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - IG_BUSINESS_ACCOUNT_ID=${IG_BUSINESS_ACCOUNT_ID:-}
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:80","http://127.0.0.1:5173"]
      - REEL_SAMPLE_SIZE=12
      - SESSION_IDLE_MINUTES=30
      - SESSION_ABSOLUTE_HOURS=12
      - INITIAL_USER=${INITIAL_USER:-agency_admin}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:-SecureAgency123!}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data: